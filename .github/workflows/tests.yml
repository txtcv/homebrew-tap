name: Homebrew

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Use the checked-out tap
        run: brew tap --custom-remote txtcv/tap "$GITHUB_WORKSPACE"

      - name: Check formula style
        run: brew style txtcv/tap

      - name: Build and install the CLI
        run: brew install --HEAD txtcv/tap/txtcv

      - name: Test the installed CLI
        run: brew test txtcv/tap/txtcv
